<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HitAtlas</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0b0f14;
    --panel: rgba(15, 20, 28, 0.85);
    --border: rgba(255, 255, 255, 0.08);
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #35d0ba;
    --dot-live: #35d0ba;
    --dot-dead: #e5534b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    display: flex;
    overflow: hidden;
  }

  #map {
    flex: 1;
    min-width: 0;
    min-height: 0;
    margin: 16px;
    border-radius: 12px;
    overflow: hidden;
    background: var(--bg);
    position: relative;
  }

  #map-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  #map-svg .land {
    fill: #1c2733;
    stroke: rgba(255, 255, 255, 0.06);
    stroke-width: 0.5;
  }

  .hud {
    position: fixed;
    z-index: 1000;
    pointer-events: none;
  }

  .hud > * {
    pointer-events: auto;
  }

  .header {
    top: 16px;
    left: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    backdrop-filter: blur(6px);
    max-width: min(90vw, 360px);
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.02em;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dot-dead);
    box-shadow: 0 0 6px var(--dot-dead);
    transition: background 0.2s, box-shadow 0.2s;
  }

  .status-dot.live {
    background: var(--dot-live);
    box-shadow: 0 0 6px var(--dot-live);
  }

  .stats {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.4;
  }

  .feed {
    width: 280px;
    flex-shrink: 0;
    height: 100%;
    overflow-y: auto;
    background: var(--panel);
    border-left: 1px solid var(--border);
    backdrop-filter: blur(6px);
  }

  .feed h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0;
    padding: 12px 14px 8px;
    position: sticky;
    top: 0;
    background: var(--panel);
  }

  .feed-item {
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    animation: fade-in 0.3s ease-out;
  }

  .feed-item .place {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .feed-item .ip {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    body {
      flex-direction: column;
    }

    #map {
      margin: 10px;
    }

    .header {
      top: 10px;
      left: 10px;
      padding: 8px 12px;
      gap: 8px;
    }

    .header h1 {
      font-size: 13px;
    }

    .stats {
      font-size: 11px;
    }

    .feed {
      width: auto;
      height: 30vh;
      border-left: none;
      border-top: 1px solid var(--border);
    }
  }
</style>
</head>
<body>

<div id="map">
  <svg id="map-svg"></svg>
</div>

<div class="hud header">
  <div class="header-top">
    <span class="status-dot" id="status-dot"></span>
    <h1>HitAtlas</h1>
  </div>
  <div class="stats" id="stats-summary">0 hits &middot; 0 users &middot; 0 countries</div>
  <div class="stats" id="stats-time">Live for 0s</div>
</div>

<div class="feed">
  <h2>Live feed</h2>
  <div id="feed-list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script>
  const REF_WIDTH = 960;
  const PADDING = 20;
  const ANTARCTICA_MAX_LAT = -60;
  const ANTIMERIDIAN_SLIVER_MAX_POINTS = 50;

  const svg = d3.select("#map-svg").attr("preserveAspectRatio", "xMidYMid meet");
  const landPath = svg.append("path").attr("class", "land");
  const pingsGroup = svg.append("g").attr("class", "pings");

  const scale = (REF_WIDTH - 2 * PADDING) / (2 * Math.PI);
  const projection = d3.geoEquirectangular().scale(scale);
  const pathGenerator = d3.geoPath(projection);

  function polygonMaxLat(polygon) {
    let maxLat = -Infinity;
    polygon.forEach((ring) => ring.forEach(([, lat]) => {
      if (lat > maxLat) maxLat = lat;
    }));
    return maxLat;
  }

  function touchesAntimeridian(polygon) {
    return polygon.some((ring) => ring.some(([lng]) => lng <= -179.9 || lng >= 179.9));
  }

  function polygonPointCount(polygon) {
    let count = 0;
    polygon.forEach((ring) => { count += ring.length; });
    return count;
  }

  d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json").then((topology) => {
    const landFeature = topojson.feature(topology, topology.objects.land).features[0];
    landFeature.geometry.coordinates = landFeature.geometry.coordinates.filter((polygon) => {
      if (polygonMaxLat(polygon) < ANTARCTICA_MAX_LAT) return false;
      if (touchesAntimeridian(polygon) && polygonPointCount(polygon) < ANTIMERIDIAN_SLIVER_MAX_POINTS) {
        return false;
      }
      return true;
    });

    const [[, minLat], [, maxLat]] = d3.geoBounds(landFeature);
    const toRad = (deg) => (deg * Math.PI) / 180;
    const topYRaw = -toRad(maxLat);
    const bottomYRaw = -toRad(minLat);
    const translateY = PADDING - topYRaw * scale;
    const refHeight = (bottomYRaw - topYRaw) * scale + 2 * PADDING;

    projection.translate([REF_WIDTH / 2, translateY]);
    svg.attr("viewBox", `0 0 ${REF_WIDTH} ${refHeight}`);
    landPath.attr("d", pathGenerator(landFeature));
  });

  const statusDot = document.getElementById("status-dot");
  const statsSummaryEl = document.getElementById("stats-summary");
  const statsTimeEl = document.getElementById("stats-time");
  const feedPanel = document.querySelector(".feed");
  const feedHeader = document.querySelector(".feed h2");
  const feedList = document.getElementById("feed-list");

  let hitCount = 0;
  const uniqueIps = new Set();
  const uniqueCountries = new Set();
  const startTime = performance.now();

  function formatPlace(hit) {
    const parts = [hit.city, hit.country].filter(Boolean);
    return parts.length ? parts.join(", ") : "Unknown location";
  }

  function formatDuration(ms) {
    const totalSeconds = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    if (h > 0) return `${h}h ${m}m`;
    if (m > 0) return `${m}m ${s}s`;
    return `${s}s`;
  }

  function updateStats() {
    const hits = `${hitCount} hit${hitCount === 1 ? "" : "s"}`;
    const users = `${uniqueIps.size} user${uniqueIps.size === 1 ? "" : "s"}`;
    const countries =
      uniqueCountries.size === 1 ? "1 country" : `${uniqueCountries.size} countries`;
    statsSummaryEl.textContent = `${hits} · ${users} · ${countries}`;
    statsTimeEl.textContent = `Live for ${formatDuration(performance.now() - startTime)}`;
  }

  function addFeedItem(hit) {
    const item = document.createElement("div");
    item.className = "feed-item";

    const place = document.createElement("span");
    place.className = "place";
    place.textContent = formatPlace(hit);

    const ip = document.createElement("span");
    ip.className = "ip";
    ip.textContent = hit.ip;

    item.appendChild(place);
    item.appendChild(ip);
    feedList.insertBefore(item, feedList.firstChild);

    const itemHeight = item.getBoundingClientRect().height;
    const availableHeight = feedPanel.clientHeight - feedHeader.offsetHeight;
    const maxItems =
      itemHeight > 0 ? Math.max(1, Math.floor(availableHeight / itemHeight)) : 10;

    while (feedList.children.length > maxItems) {
      feedList.removeChild(feedList.lastChild);
    }
  }

  function pingMap(hit) {
    const coords = projection([hit.lng, hit.lat]);
    if (!coords) return;
    const [x, y] = coords;

    const circle = pingsGroup
      .append("circle")
      .attr("cx", x)
      .attr("cy", y)
      .attr("r", 3)
      .attr("fill", "#35d0ba")
      .attr("fill-opacity", 0.6)
      .attr("stroke", "#35d0ba")
      .attr("stroke-width", 2);

    circle.append("title").text(`${formatPlace(hit)}\n${hit.ip}`);

    const start = performance.now();
    const duration = 1400;
    const maxRadius = 22;

    function animate(now) {
      const t = Math.min((now - start) / duration, 1);
      circle
        .attr("r", 3 + t * maxRadius)
        .attr("fill-opacity", 0.6 * (1 - t))
        .attr("stroke-opacity", 1 - t);
      if (t < 1) {
        requestAnimationFrame(animate);
      } else {
        circle.remove();
      }
    }
    requestAnimationFrame(animate);
  }

  function connect() {
    const source = new EventSource("/events");

    source.onopen = () => statusDot.classList.add("live");
    source.onerror = () => statusDot.classList.remove("live");

    source.onmessage = (event) => {
      const hit = JSON.parse(event.data);
      hitCount += 1;
      uniqueIps.add(hit.ip);
      if (hit.country) uniqueCountries.add(hit.country);
      updateStats();
      pingMap(hit);
      addFeedItem(hit);
    };
  }

  connect();
  updateStats();
  setInterval(updateStats, 1000);
</script>

</body>
</html>
