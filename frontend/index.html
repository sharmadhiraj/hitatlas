<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HitAtlas</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #0b0f14;
    --panel: rgba(15, 20, 28, 0.85);
    --border: rgba(255, 255, 255, 0.08);
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #35d0ba;
    --dot-live: #35d0ba;
    --dot-dead: #e5534b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    display: flex;
    overflow: hidden;
  }

  #map {
    flex: 1;
    min-width: 0;
    background: var(--bg);
  }

  .hud {
    position: fixed;
    z-index: 1000;
    pointer-events: none;
  }

  .hud > * {
    pointer-events: auto;
  }

  .header {
    top: 16px;
    left: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    backdrop-filter: blur(6px);
    max-width: min(90vw, 360px);
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.02em;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dot-dead);
    box-shadow: 0 0 6px var(--dot-dead);
    transition: background 0.2s, box-shadow 0.2s;
  }

  .status-dot.live {
    background: var(--dot-live);
    box-shadow: 0 0 6px var(--dot-live);
  }

  .stats {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.4;
  }

  .feed {
    width: 280px;
    flex-shrink: 0;
    height: 100%;
    overflow-y: auto;
    background: var(--panel);
    border-left: 1px solid var(--border);
    backdrop-filter: blur(6px);
  }

  .feed h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0;
    padding: 12px 14px 8px;
    position: sticky;
    top: 0;
    background: var(--panel);
  }

  .feed-item {
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    animation: fade-in 0.3s ease-out;
  }

  .feed-item .place {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .feed-item .ip {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .leaflet-control-attribution {
    background: rgba(11, 15, 20, 0.7) !important;
    color: var(--muted) !important;
  }
  .leaflet-control-attribution a {
    color: var(--muted) !important;
  }

  @media (max-width: 640px) {
    body {
      flex-direction: column;
    }

    .header {
      top: 10px;
      left: 10px;
      padding: 8px 12px;
      gap: 8px;
    }

    .header h1 {
      font-size: 13px;
    }

    .stats {
      font-size: 11px;
    }

    .feed {
      width: auto;
      height: 30vh;
      border-left: none;
      border-top: 1px solid var(--border);
    }
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="hud header">
  <div class="header-top">
    <span class="status-dot" id="status-dot"></span>
    <h1>HitAtlas</h1>
  </div>
  <div class="stats" id="stats">0 hits</div>
</div>

<div class="feed">
  <h2>Live feed</h2>
  <div id="feed-list"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const worldBounds = L.latLngBounds([-85, -180], [85, 180]);

  const map = L.map("map", {
    zoomControl: false,
    dragging: false,
    scrollWheelZoom: false,
    doubleClickZoom: false,
    touchZoom: false,
    boxZoom: false,
    keyboard: false,
    maxBounds: worldBounds,
    maxBoundsViscosity: 1.0,
  });

  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: "abcd",
    maxZoom: 19,
    noWrap: true,
  }).addTo(map);

  function fitMapToCover() {
    map.invalidateSize();
    const size = map.getSize();
    const zoom = Math.max(0, Math.ceil(Math.log2(Math.max(size.x, size.y) / 256)));
    map.setView([0, 0], zoom, { animate: false });
  }

  fitMapToCover();
  window.addEventListener("resize", fitMapToCover);

  const statusDot = document.getElementById("status-dot");
  const statsEl = document.getElementById("stats");
  const feedList = document.getElementById("feed-list");

  let hitCount = 0;
  const uniqueIps = new Set();
  const uniqueCountries = new Set();
  const startTime = performance.now();
  const MAX_FEED_ITEMS = 10;

  function formatPlace(hit) {
    const parts = [hit.city, hit.country].filter(Boolean);
    return parts.length ? parts.join(", ") : "Unknown location";
  }

  function formatDuration(ms) {
    const totalSeconds = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    if (h > 0) return `${h}h ${m}m`;
    if (m > 0) return `${m}m ${s}s`;
    return `${s}s`;
  }

  function updateStats() {
    const hits = `${hitCount} hit${hitCount === 1 ? "" : "s"}`;
    const users = `${uniqueIps.size} user${uniqueIps.size === 1 ? "" : "s"}`;
    const elapsed = formatDuration(performance.now() - startTime);
    const countries =
      uniqueCountries.size === 1 ? "1 country" : `${uniqueCountries.size} countries`;
    statsEl.textContent = `${hits} from ${users} in ${elapsed} from ${countries}`;
  }

  function addFeedItem(hit) {
    const item = document.createElement("div");
    item.className = "feed-item";

    const place = document.createElement("span");
    place.className = "place";
    place.textContent = formatPlace(hit);

    const ip = document.createElement("span");
    ip.className = "ip";
    ip.textContent = hit.ip;

    item.appendChild(place);
    item.appendChild(ip);
    feedList.insertBefore(item, feedList.firstChild);

    while (feedList.children.length > MAX_FEED_ITEMS) {
      feedList.removeChild(feedList.lastChild);
    }
  }

  function pingMap(hit) {
    const marker = L.circleMarker([hit.lat, hit.lng], {
      radius: 3,
      color: "#35d0ba",
      weight: 2,
      fillColor: "#35d0ba",
      fillOpacity: 0.6,
    }).addTo(map);

    marker.bindTooltip(`${formatPlace(hit)}<br>${hit.ip}`);

    const start = performance.now();
    const duration = 1400;
    const maxRadius = 22;

    function animate(now) {
      const t = Math.min((now - start) / duration, 1);
      marker.setRadius(3 + t * maxRadius);
      marker.setStyle({ opacity: 1 - t, fillOpacity: 0.6 * (1 - t) });
      if (t < 1) {
        requestAnimationFrame(animate);
      } else {
        map.removeLayer(marker);
      }
    }
    requestAnimationFrame(animate);
  }

  function connect() {
    const source = new EventSource("/events");

    source.onopen = () => statusDot.classList.add("live");
    source.onerror = () => statusDot.classList.remove("live");

    source.onmessage = (event) => {
      const hit = JSON.parse(event.data);
      hitCount += 1;
      uniqueIps.add(hit.ip);
      if (hit.country) uniqueCountries.add(hit.country);
      updateStats();
      pingMap(hit);
      addFeedItem(hit);
    };
  }

  connect();
  updateStats();
  setInterval(updateStats, 1000);
</script>

</body>
</html>
